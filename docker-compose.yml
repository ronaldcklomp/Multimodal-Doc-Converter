version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: multimodal-doc-converter-qdrant
    ports:
      - "6333:6333"       # Qdrant REST API & Dashboard
      - "6334:6334"       # Qdrant gRPC API
    volumes:
      - ./qdrant_storage:/qdrant/storage
      - ./qdrant_snapshots:/qdrant/snapshots
    environment:
      # QDRANT_API_KEY: optional, for security in production
      QDRANT_LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qdrant-network

networks:
  qdrant-network:
    driver: bridge

# Usage:
# docker-compose up -d                    # Start in background
# docker-compose logs -f qdrant          # View logs
# docker-compose down                    # Stop and remove
# curl http://localhost:6333/health      # Check health
# Open http://localhost:6333/dashboard   # Web dashboard
